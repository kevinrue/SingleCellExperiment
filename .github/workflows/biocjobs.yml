# Builds the package image, generates the BiocJobs wrappers inside it and
# tests the Galaxy tool. Wrappers and the planemo report are downloadable
# from the run's artifacts.
name: BiocJobs

on:
  push:
    branches:
      - biofair-biocjobs
  workflow_dispatch:

jobs:
  biocjobs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: kevinrue/BiocJobs/biocjobs-action@patch-1
        with:
          base-image: ghcr.io/bioconductor/bioconductor:devel
          image-tag: devel

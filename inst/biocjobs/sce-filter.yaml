biocjobs: "1.0"
name: sce-filter
package: SingleCellExperiment
title: Filter rows and columns of a SingleCellExperiment object
tagline: Filter rows and columns of a SingleCellExperiment object (H5AD)
description: >
  Filter rows and columns of a SingleCellExperiment object
  stored in an H5AD file.
version: "0.1.0"
license: MIT
script: scripts/sce-filter.R
depends: [anndataR, jsonlite]

inputs:
  - name: infile
    format: h5ad
    label: Input H5AD file
    help: >
      Input H5AD file.

  - name: metadata_filters
    format: json
    label: Metadata predicates
    help: >
      Required JSON object with exactly rowdata and coldata sections.
      Use an empty object to disable filtering for a dimension.

outputs:
  - name: outfile
    format: h5ad
    label: Output H5AD file

resources:
  cpus: 1
  memory_gb: 4
  disk_gb: 10

# citations:
#   - doi: 10.1000/your.method.paper

tests:                      # exercised by the generated Galaxy wrapper
  - inputs: 
      infile: test-data/sce.h5ad
      metadata_filters: test-data/metadata-filters.json
    outputs:
      outfile:
        file: test-data/sce.filter.h5ad
        compare: sim_size
        delta: 3000
